# Every morning: email signed-in visitors about events they saved that start tomorrow.
# Uses SUPABASE_URL and SUPABASE_SERVICE_KEY, plus the email secrets SMTP_HOST, SMTP_PORT,
# SMTP_USER, SMTP_PASS and MAIL_FROM. Without the email secrets it only counts.
name: Event reminders

on:
  schedule:
    - cron: "41 6 * * *"      # every day, 07:41 Lagos time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python scripts/reminders.py
