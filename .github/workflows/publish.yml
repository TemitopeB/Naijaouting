# Builds the public pages that travel outside the app (scripts/publish.py):
# event pages with WhatsApp/Facebook/X previews (e/), the calendar and reminder feed
# (data/feed.json), this weekend's picks (weekend/) and the sitemap.
# Runs four times a day, after the morning landing-data refresh and when the script changes.
# Secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the same ones the landing data uses).
name: Publish event pages

on:
  schedule:
    - cron: "37 4,10,15,20 * * *"   # 05:37, 11:37, 16:37 and 21:37 Lagos time
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "scripts/publish.py"
  workflow_run:
    workflows: ["Refresh landing data", "Monday event sweep"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install playwright==1.47.0 pillow==11.1.0 fonttools==4.55.3 brotli==1.1.0
          python -m playwright install --with-deps chromium
      - name: Build event pages, feeds and weekend picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/publish.py
      - name: Save if changed
        run: |
          git config user.name "naijaouting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A e weekend data/feed.json data/weekend.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Publish event pages and feeds"
            git pull --rebase -X theirs origin main
            git push
          fi
