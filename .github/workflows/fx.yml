# Updates data/fx.json every morning: exchange rates for "prices in your currency".
name: Refresh exchange rates

on:
  schedule:
    - cron: "37 4 * * *"      # every day, 05:37 Lagos time
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/fx.yml"
      - "scripts/fx.py"

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch rates
        run: python scripts/fx.py
      - name: Save if changed
        run: |
          git config user.name "naijaouting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fx.json
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -qm "Refresh exchange rates"
            git pull --rebase -X theirs origin main
            git push
          fi
