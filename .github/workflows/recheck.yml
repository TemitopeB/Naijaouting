# Twice a day: re-check the official page of each upcoming event for cancellations,
# postponements, new dates, venue changes and sold-out notices (scripts/recheck.py), and search
# the news for events that only have Instagram links.
# Clear changes (Eventbrite's own data, or a sentence copied from the official page / news source that
# really is on that page) are applied on the site straight away and listed in Review with an Undo
# button. Anything less certain waits in Review -> Corrections for an admin to tap.
# Set the repository variable RECHECK_AUTO_APPLY to 0 to go back to "suggest only".
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, GEMINI_API_KEY (and optionally EVENTBRITE_TOKEN).
name: Daily event re-check

on:
  schedule:
    - cron: "13 7 * * *"      # every day, 08:13 Lagos time
    - cron: "13 16 * * *"     # and 17:13 Lagos time
  workflow_dispatch:
    inputs:
      all:
        description: "Check every upcoming event today (not only the next 14 days)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/recheck.yml"
      - "scripts/recheck.py"

permissions:
  contents: read

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Re-check upcoming events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          RECHECK_AUTO_APPLY: ${{ vars.RECHECK_AUTO_APPLY || '1' }}
        run: python scripts/recheck.py ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && '--all' || '' }}
